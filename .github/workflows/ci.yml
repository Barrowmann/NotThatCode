name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CORE_INSTALL_ARGS: --filter=. --filter=@t3tools/desktop... --filter=t3... --filter=./packages/*... --filter=@t3tools/scripts...

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      test: ${{ steps.detect.outputs.test }}
      test_packages: ${{ steps.detect.outputs.test_packages }}
      test_desktop: ${{ steps.detect.outputs.test_desktop }}
      test_web: ${{ steps.detect.outputs.test_web }}
      test_server: ${{ steps.detect.outputs.test_server }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          sparse-checkout: |
            /pnpm-workspace.yaml
            /.github/scripts/ci-changes.cjs
            /.github/actions/ci-changes/
            /*/package.json
            /*/*/package.json
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Detect affected jobs
        id: detect
        uses: ./.github/actions/ci-changes

  static_checks:
    name: Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.CORE_INSTALL_ARGS }} --filter=@t3tools/oxlint-plugin-t3code...

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck desktop, web, server, and shared packages
        run: vp run --parallel --concurrency-limit 3 --filter @t3tools/desktop --filter @t3tools/web --filter t3 --filter './packages/*' typecheck

      - name: Test daily build commit selection
        run: node --test .github/scripts/daily-desktop-commit.test.cjs

  test:
    name: Test Shared Packages
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.CORE_INSTALL_ARGS }}

      - name: Test affected packages
        env:
          TEST_PACKAGES: ${{ needs.changes.outputs.test_packages }}
        run: |
          filters=(--filter './packages/*')
          if [[ -n "$TEST_PACKAGES" ]]; then
            read -ra packages <<< "$TEST_PACKAGES"
            filters=()
            for package in "${packages[@]}"; do filters+=(--filter "$package"); done
          fi
          vp run --parallel --concurrency-limit 4 "${filters[@]}" test

  test_desktop:
    name: Test Desktop
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test_desktop != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.CORE_INSTALL_ARGS }}

      - name: Install desktop test prerequisites
        run: |
          if ! pkg-config --exists libsecret-1; then
            sudo apt-get update
            sudo apt-get install -y libsecret-1-dev pkg-config
          fi
          vp run --filter @t3tools/desktop ensure:electron

      - name: Test desktop
        run: vp run --filter @t3tools/desktop test

  test_web:
    name: Test Web ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test_web != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.CORE_INSTALL_ARGS }}

      - name: Install Chromium
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          if ldd "${browser:?}" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test web
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test_server != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: ${{ env.CORE_INSTALL_ARGS }}

      - name: Install Chromium
        run: |
          node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          if ldd "${browser:?}" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      - name: Test server
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  rust:
    name: Rust
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /.github/actions/drop-checkout-credentials/
            /.cargo/
            /native/
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check and test Rust crates
        run: |
          for crate in resource-monitor kde-snap-shot hyprland-snap-shot; do
            cargo fmt --manifest-path "native/$crate/Cargo.toml" -- --check
            cargo test --locked --manifest-path "native/$crate/Cargo.toml"
          done

  check:
    name: Check
    if: always()
    needs: [changes, static_checks, test, test_desktop, test_web, test_server, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require CI jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            .changes.outputs as $gates |
            del(.changes) |
            all(to_entries[];
              .value.result == "success"
              or (.value.result == "skipped" and $gates[.key] == "false"))
          ' <<< "$RESULTS"
