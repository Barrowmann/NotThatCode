name: Daily Desktop Build

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
      timezone: Asia/Shanghai

permissions:
  contents: read

jobs:
  select_commit:
    name: Select build commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      date: ${{ steps.select.outputs.date }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      - name: Select commit
        id: select
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { selectDailyDesktopCommit } = require("./.github/scripts/daily-desktop-commit.cjs");
            const { date, sha } = await selectDailyDesktopCommit(github, context);
            core.setOutput("date", date);
            core.setOutput("sha", sha);
            core.info(sha ? "Building " + sha + " for " + date : "No main commits for " + date);

  build:
    name: Build ${{ matrix.platform }}
    needs: select_commit
    if: needs.select_commit.outputs.sha != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            rust-target: x86_64-pc-windows-msvc
            command: dist:desktop:win:x64
            artifact: windows-x64
            extension: exe
          - platform: macOS arm64
            runner: macos-26
            rust-target: aarch64-apple-darwin
            command: dist:desktop:dmg:arm64
            artifact: macos-arm64
            extension: dmg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.select_commit.outputs.sha }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/drop-checkout-credentials

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=. --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Resolve test version
        id: version
        shell: bash
        env:
          BUILD_DATE: ${{ needs.select_commit.outputs.date }}
        run: >-
          node scripts/resolve-nightly-release.ts --channel preview
          --date "${BUILD_DATE//-/}" --run-number "$GITHUB_RUN_NUMBER"
          --sha "$(git rev-parse HEAD)" --github-output

      - name: Package test installer
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.command }}
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          T3CODE_DESKTOP_SIGNED: "false"
        run: vp run "$BUILD_COMMAND" --build-version "$BUILD_VERSION"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.artifact }}-${{ needs.select_commit.outputs.date }}-${{ needs.select_commit.outputs.sha }}
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error
          overwrite: true
